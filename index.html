<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimensionamento de Rampas e Declividades</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-subtle: #f1f5f9;
            --border: #e2e8f0;
            --border-focus: #0f172a;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --accent: #0f172a;
            --accent-hover: #1e293b;
            --calc-highlight-bg: #f0fdf4;
            --calc-highlight-border: #86efac;
            --calc-highlight-text: #166534;
            --danger-bg: #fef2f2;
            --danger-text: #991b1b;
            --danger-border: #fecaca;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --svg-line: #0f172a;
            --svg-fill: #e2e8f0;
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        [data-theme="dark"] {
            --bg: #090d16;
            --surface: #111827;
            --surface-subtle: #1f2937;
            --border: #374151;
            --border-focus: #93c5fd;
            --text-primary: #f9fafb;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --accent: #f8fafc;
            --accent-hover: #e2e8f0;
            --calc-highlight-bg: #064e3b;
            --calc-highlight-border: #059669;
            --calc-highlight-text: #a7f3d0;
            --danger-bg: #450a0a;
            --danger-text: #fecaca;
            --danger-border: #7f1d1d;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.5);
            --shadow-md: 0 4px 12px 0 rgb(0 0 0 / 0.3);
            --svg-line: #94a3b8;
            --svg-fill: #1f2937;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: var(--shadow-md);
            width: 100%;
            max-width: 520px;
            overflow: hidden;
        }

        .card-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .header-title h1 {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.01em;
            text-transform: uppercase;
            color: var(--text-primary);
        }

        .header-title span {
            font-size: 12px;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        .theme-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-family: var(--font-sans);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
        }

        .theme-btn:hover {
            background-color: var(--surface-subtle);
            color: var(--text-primary);
        }

        /* Preview Esquemático */
        .diagram-container {
            padding: 16px 24px;
            background: var(--surface-subtle);
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .diagram-container svg {
            width: 100%;
            height: 90px;
            overflow: visible;
        }

        .svg-text {
            font-family: var(--font-mono);
            font-size: 10px;
            fill: var(--text-secondary);
        }

        .card-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field-label {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .field-label .symbol {
            font-family: var(--font-mono);
            color: var(--text-muted);
            font-weight: 400;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input {
            width: 100%;
            height: 40px;
            padding: 0 38px 0 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: var(--surface);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 14px;
            font-weight: 500;
            outline: none;
            transition: border-color 0.15s, background-color 0.15s;
        }

        input:focus {
            border-color: var(--border-focus);
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        .input-wrapper .unit {
            position: absolute;
            right: 12px;
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-muted);
            pointer-events: none;
        }

        /* Destaque para campo calculado */
        input.is-calculated {
            background-color: var(--calc-highlight-bg);
            border-color: var(--calc-highlight-border);
            color: var(--calc-highlight-text);
            font-weight: 600;
        }

        /* Painel NBR 9050 */
        .norma-badge {
            display: none;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.4;
            font-family: var(--font-mono);
            border: 1px solid var(--border);
            background: var(--surface-subtle);
        }

        .norma-badge.active {
            display: block;
        }

        .norma-badge.ok {
            border-color: var(--calc-highlight-border);
            background: var(--calc-highlight-bg);
            color: var(--calc-highlight-text);
        }

        .norma-badge.warning {
            border-color: #fed7aa;
            background: #fff7ed;
            color: #9a3412;
        }

        [data-theme="dark"] .norma-badge.warning {
            border-color: #9a3412;
            background: #431407;
            color: #fdba74;
        }

        .status-bar {
            min-height: 20px;
            font-size: 12px;
            font-family: var(--font-mono);
            color: var(--text-muted);
            display: flex;
            align-items: center;
        }

        .status-bar.error {
            color: var(--danger-text);
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        .btn {
            height: 40px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            font-family: var(--font-sans);
        }

        .btn-primary {
            flex: 2;
            background-color: var(--accent);
            color: var(--surface);
            border: 1px solid var(--accent);
        }

        [data-theme="dark"] .btn-primary {
            color: #090d16;
        }

        .btn-primary:hover {
            opacity: 0.92;
        }

        .btn-secondary {
            flex: 1;
            background-color: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background-color: var(--surface-subtle);
            color: var(--text-primary);
        }

        @media (max-width: 480px) {
            .grid-inputs {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <header class="card-header">
            <div class="header-title">
                <h1>Rampas & Declividades</h1>
                <span>i = (Δh / c) × 100</span>
            </div>
            <button class="theme-btn" id="themeToggle" type="button">
                <span id="themeIcon">◐</span>
                <span id="themeText">Tema</span>
            </button>
        </header>

        <!-- Visualizador Esquemático -->
        <div class="diagram-container">
            <svg viewBox="0 0 400 90" preserveAspectRatio="none">
                <!-- Rampa -->
                <polygon points="40,75 360,75 360,25" fill="var(--svg-fill)" stroke="var(--svg-line)" stroke-width="1.5" />
                
                <!-- Cotas / Linhas de Chamada -->
                <line x1="40" y1="82" x2="360" y2="82" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="2 2" />
                <line x1="368" y1="25" x2="368" y2="75" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="2 2" />

                <!-- Textos Técnicos -->
                <text x="200" y="80" text-anchor="middle" class="svg-text" id="svgLengthLabel">c: -- m</text>
                <text x="375" y="52" text-anchor="start" class="svg-text" id="svgDeltaLabel">Δh: -- m</text>
                <text x="190" y="45" text-anchor="middle" class="svg-text" id="svgSlopeLabel" font-weight="bold">i: -- %</text>
            </svg>
        </div>

        <div class="card-body">
            <div class="grid-inputs">
                <!-- Cota Inicial -->
                <div class="field-group">
                    <label class="field-label" for="ci">
                        <span>Cota Inicial</span>
                        <span class="symbol">ci</span>
                    </label>
                    <div class="input-wrapper">
                        <input type="number" id="ci" step="any" placeholder="0.000">
                        <span class="unit">m</span>
                    </div>
                </div>

                <!-- Cota Final -->
                <div class="field-group">
                    <label class="field-label" for="cf">
                        <span>Cota Final</span>
                        <span class="symbol">cf</span>
                    </label>
                    <div class="input-wrapper">
                        <input type="number" id="cf" step="any" placeholder="0.000">
                        <span class="unit">m</span>
                    </div>
                </div>

                <!-- Comprimento -->
                <div class="field-group">
                    <label class="field-label" for="c">
                        <span>Comprimento</span>
                        <span class="symbol">c</span>
                    </label>
                    <div class="input-wrapper">
                        <input type="number" id="c" step="any" placeholder="0.000">
                        <span class="unit">m</span>
                    </div>
                </div>

                <!-- Inclinação -->
                <div class="field-group">
                    <label class="field-label" for="i">
                        <span>Inclinação</span>
                        <span class="symbol">i</span>
                    </label>
                    <div class="input-wrapper">
                        <input type="number" id="i" step="any" placeholder="0.000">
                        <span class="unit">%</span>
                    </div>
                </div>
            </div>

            <!-- Parecer Normativo NBR 9050 -->
            <div class="norma-badge" id="normaBadge"></div>

            <div class="status-bar" id="statusMessage">Informe 3 variáveis para calcular a 4ª.</div>

            <div class="actions">
                <button class="btn btn-primary" onclick="handleCalculate()">Calcular</button>
                <button class="btn btn-secondary" onclick="handleReset()">Limpar</button>
            </div>
        </div>
    </div>

    <script>
        const inputs = {
            ci: document.getElementById('ci'),
            cf: document.getElementById('cf'),
            c: document.getElementById('c'),
            i: document.getElementById('i')
        };

        const statusMessage = document.getElementById('statusMessage');
        const normaBadge = document.getElementById('normaBadge');
        const themeToggle = document.getElementById('themeToggle');
        
        // SVG labels
        const svgSlopeLabel = document.getElementById('svgSlopeLabel');
        const svgDeltaLabel = document.getElementById('svgDeltaLabel');
        const svgLengthLabel = document.getElementById('svgLengthLabel');

        // Tema
        const initTheme = () => {
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (saved === 'dark' || (!saved && prefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        };

        themeToggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', target);
            localStorage.setItem('theme', target);
        });

        initTheme();

        // Limpeza de marcações visuais
        function resetHighlights() {
            Object.values(inputs).forEach(input => input.classList.remove('is-calculated'));
        }

        // Validação da NBR 9050 (Acessibilidade)
        function checkAccessibility(slope, deltaH) {
            const absSlope = Math.abs(slope);
            normaBadge.className = 'norma-badge active';

            if (absSlope <= 5.00) {
                normaBadge.className += ' ok';
                normaBadge.innerHTML = `<strong>NBR 9050:</strong> i = ${absSlope.toFixed(2)}% (Sem limite de desnível por segmento).`;
            } else if (absSlope <= 6.25) {
                const maxH = 1.00;
                normaBadge.className += ' ok';
                normaBadge.innerHTML = `<strong>NBR 9050:</strong> i = ${absSlope.toFixed(2)}% (Permitido desnível máx. de ${maxH}m por segmento).`;
            } else if (absSlope <= 8.333) {
                const maxH = 0.80;
                normaBadge.className += ' ok';
                normaBadge.innerHTML = `<strong>NBR 9050:</strong> i = ${absSlope.toFixed(2)}% (Permitido desnível máx. de ${maxH}m por segmento).`;
            } else if (absSlope <= 12.5) {
                normaBadge.className += ' warning';
                normaBadge.innerHTML = `<strong>Atenção:</strong> Declividade elevada (${absSlope.toFixed(2)}%). Permitida apenas em reformas onde 8.33% seja inviável.`;
            } else {
                normaBadge.className += ' warning';
                normaBadge.innerHTML = `<strong>Declividade Crítica:</strong> ${absSlope.toFixed(2)}% excede o limite normativo para pedestres (NBR 9050).`;
            }
        }

        // Atualização do esquema SVG
        function updateDiagram(ci, cf, c, i) {
            const deltaH = (!isNaN(cf) && !isNaN(ci)) ? (cf - ci) : null;
            
            svgSlopeLabel.textContent = !isNaN(i) ? `i: ${i.toFixed(2)}%` : 'i: -- %';
            svgLengthLabel.textContent = !isNaN(c) ? `c: ${c.toFixed(2)} m` : 'c: -- m';
            svgDeltaLabel.textContent = deltaH !== null ? `Δh: ${deltaH.toFixed(2)} m` : 'Δh: -- m';

            if (!isNaN(i) && deltaH !== null) {
                checkAccessibility(i, deltaH);
            } else {
                normaBadge.className = 'norma-badge';
            }
        }

        function handleCalculate() {
            resetHighlights();
            
            const vals = {
                ci: inputs.ci.value !== '' ? parseFloat(inputs.ci.value) : NaN,
                cf: inputs.cf.value !== '' ? parseFloat(inputs.cf.value) : NaN,
                c: inputs.c.value !== '' ? parseFloat(inputs.c.value) : NaN,
                i: inputs.i.value !== '' ? parseFloat(inputs.i.value) : NaN
            };

            const filled = Object.entries(vals).filter(([_, v]) => !isNaN(v));

            if (filled.length !== 3) {
                statusMessage.className = 'status-bar error';
                statusMessage.textContent = 'Erro: Preencha exatamente 3 campos para calcular.';
                return;
            }

            let resultKey = '';
            let calculatedVal = 0;

            if (isNaN(vals.cf)) {
                // cf = ci + (i/100 * c)
                calculatedVal = vals.ci + ((vals.i / 100) * vals.c);
                resultKey = 'cf';
            } else if (isNaN(vals.ci)) {
                // ci = cf - (i/100 * c)
                calculatedVal = vals.cf - ((vals.i / 100) * vals.c);
                resultKey = 'ci';
            } else if (isNaN(vals.c)) {
                // c = (cf - ci) / (i / 100)
                if (vals.i === 0) {
                    statusMessage.className = 'status-bar error';
                    statusMessage.textContent = 'Erro: Inclinação zero inviabiliza cálculo de comprimento.';
                    return;
                }
                calculatedVal = (vals.cf - vals.ci) / (vals.i / 100);
                resultKey = 'c';
            } else if (isNaN(vals.i)) {
                // i = ((cf - ci) / c) * 100
                if (vals.c === 0) {
                    statusMessage.className = 'status-bar error';
                    statusMessage.textContent = 'Erro: Comprimento não pode ser zero.';
                    return;
                }
                calculatedVal = ((vals.cf - vals.ci) / vals.c) * 100;
                resultKey = 'i';
            }

            vals[resultKey] = calculatedVal;
            inputs[resultKey].value = calculatedVal.toFixed(3);
            inputs[resultKey].classList.add('is-calculated');

            statusMessage.className = 'status-bar';
            statusMessage.textContent = `Cálculo concluído com sucesso.`;

            updateDiagram(vals.ci, vals.cf, vals.c, vals.i);
        }

        function handleReset() {
            Object.values(inputs).forEach(input => input.value = '');
            resetHighlights();
            statusMessage.className = 'status-bar';
            statusMessage.textContent = 'Informe 3 variáveis para calcular a 4ª.';
            normaBadge.className = 'norma-badge';
            updateDiagram(NaN, NaN, NaN, NaN);
            inputs.ci.focus();
        }

        // Suporte ao Enter
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleCalculate();
        });

        // Limpa destaque ao editar
        Object.values(inputs).forEach(input => {
            input.addEventListener('input', () => {
                resetHighlights();
                statusMessage.className = 'status-bar';
                statusMessage.textContent = 'Aguardando comando de cálculo...';
            });
        });
    </script>
</body>
</html>
